[package]
name = "dsh-app"
version = "0.1.0"
description = "Cross-platform desktop client for DeepSeek Harness"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "dsh_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "custom-protocol"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
