# 三端打包工作流：
#   - 推送 v* tag → 构建 Windows / macOS / Linux 全部平台并创建 Draft Release
#   - 手动触发 (workflow_dispatch) → 默认只构建 Windows，方便调试迭代，
#     可选 macos / linux / all；产物以 Actions Artifact 形式提供（不打 Release）
name: build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platform:
        description: '手动/调试构建的平台（tag 推送始终构建全部平台）'
        type: choice
        required: true
        default: windows
        options:
          - windows
          - macos
          - linux
          - all

# tauri-action 需要创建 Release 并上传产物 → 显式要求 contents 写权限
# （仓库默认 Workflow permissions 是只读，会报 "Resource not accessible by integration"）
permissions:
  contents: write

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        run: |
          ALL='[{"name":"windows","platform":"windows-latest","args":""},{"name":"macos-arm64","platform":"macos-latest","args":"--target aarch64-apple-darwin"},{"name":"macos-x64","platform":"macos-latest","args":"--target x86_64-apple-darwin"},{"name":"linux","platform":"ubuntu-latest","args":""}]'
          WIN='[{"name":"windows","platform":"windows-latest","args":""}]'
          MAC='[{"name":"macos-arm64","platform":"macos-latest","args":"--target aarch64-apple-darwin"},{"name":"macos-x64","platform":"macos-latest","args":"--target x86_64-apple-darwin"}]'
          LIN='[{"name":"linux","platform":"ubuntu-latest","args":""}]'
          if [ "${{ github.event_name }}" = "push" ]; then
            M="$ALL"
          else
            case "${{ github.event.inputs.platform }}" in
              macos) M="$MAC" ;;
              linux) M="$LIN" ;;
              all) M="$ALL" ;;
              *) M="$WIN" ;;
            esac
          fi
          echo "matrix=$M" >> "$GITHUB_OUTPUT"

  build:
    needs: select
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.matrix) }}

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev

      - name: Install frontend dependencies
        run: npm install

      - name: Build with Tauri (tag push → create Draft Release)
        if: github.event_name == 'push'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__   # 自动取 package.json 版本（如 0.1.0 → v0.1.0）
          releaseName: 'DeepSeek Harness App v__VERSION__'
          releaseBody: 'See docs/RELEASE-NOTES-v__VERSION__.md for the full notes.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Build with Tauri (manual/debug → no release)
        if: github.event_name != 'push'
        run: npm run tauri build -- ${{ matrix.args }}

      - name: Upload bundle (manual/debug)
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: dsh-${{ matrix.name }}
          path: src-tauri/target/release/bundle/**/*
          if-no-files-found: error
