# 三端打包工作流：推送 v* tag 自动构建 Windows / macOS / Linux 并创建 Draft Release
name: build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# tauri-action 需要创建 Release 并上传产物 → 显式要求 contents 写权限
# （仓库默认 Workflow permissions 是只读，会报 "Resource not accessible by integration"）
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-latest
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev

      - name: Install frontend dependencies
        run: npm install

      - name: Build with Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__   # 自动取 package.json 版本（如 0.1.0 → v0.1.0）
          releaseName: 'DeepSeek Harness App v__VERSION__'
          releaseBody: 'See docs/RELEASE-NOTES-v__VERSION__.md for the full notes.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
